<script type="text/javascript">
        var gk_isXlsx = false;
        var gk_xlsxFileLookup = {};
        var gk_fileData = {};
        function filledCell(cell) {
          return cell !== '' && cell != null;
        }
        function loadFileData(filename) {
        if (gk_isXlsx && gk_xlsxFileLookup[filename]) {
            try {
                var workbook = XLSX.read(gk_fileData[filename], { type: 'base64' });
                var firstSheetName = workbook.SheetNames[0];
                var worksheet = workbook.Sheets[firstSheetName];

                // Convert sheet to JSON to filter blank rows
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1, blankrows: false, defval: '' });
                // Filter out blank rows (rows where all cells are empty, null, or undefined)
                var filteredData = jsonData.filter(row => row.some(filledCell));

                // Heuristic to find the header row by ignoring rows with fewer filled cells than the next row
                var headerRowIndex = filteredData.findIndex((row, index) =>
                  row.filter(filledCell).length >= filteredData[index + 1]?.filter(filledCell).length
                );
                // Fallback
                if (headerRowIndex === -1 || headerRowIndex > 25) {
                  headerRowIndex = 0;
                }

                // Convert filtered JSON back to CSV
                var csv = XLSX.utils.aoa_to_sheet(filteredData.slice(headerRowIndex)); // Create a new sheet from filtered array of arrays
                csv = XLSX.utils.sheet_to_csv(csv, { header: 1 });
                return csv;
            } catch (e) {
                console.error(e);
                return "";
            }
        }
        return gk_fileData[filename] || "";

        function startAttacker() {
            try {
                addToLog('Attacker has begun their assault from the Internet!');
                performAttackerAction();
            } catch (error) {
                console.error('Error starting attacker:', error);
                addToLog('Attacker failed to start due to an error.');
            }
        }

        function performAttackerAction() {
            try {
                if (attacker.compromisedNodes.includes(8)) return; // Stop if File Server is compromised
                const reachableNodes = attacker.reachableNodes.filter(id => {
                    const node = nodes.get(id);
                    return !node.hardened && !node.isolated && !node.compromised;
                });
                if (reachableNodes.length === 0) {
                    addToLog('Attacker has no reachable nodes to target. You win!');
                    showWinModal();
                    return;
                }
                const targetId = reachableNodes[Math.floor(Math.random() * reachableNodes.length)];
                const node = nodes.get(targetId);
                let action = 'scan';
                if (attacker.scannedNodes.includes(targetId)) {
                    action = Math.random() < 0.7 ? 'exploit' : 'scan';
                }
                switch (action) {
                    case 'scan':
                        attacker.scannedNodes.push(targetId);
                        nodes.update({ id: targetId, label: node.originalLabel, color: { background: '#00FFFF', border: '#00CCFF' } });
                        addToLog(`Attacker scanned ${node.originalLabel} (Node ${targetId}).`);
                        break;
                    case 'exploit':
                        if (node.required_tool && !attacker.tools.includes(node.required_tool)) {
                            addToLog(`Attacker failed to exploit ${node.originalLabel} (Node ${targetId}): Missing ${node.required_tool}.`);
                            return;
                        }
                        node.compromised = true;
                        attacker.compromisedNodes.push(targetId);
                        nodes.update({ id: targetId, color: { background: '#FF0000', border: '#FF3333' } });
                        applyNodeGlow(targetId, '#FF0000');
                        if (node.contains_tools && node.contains_tools.length > 0) {
                            attacker.tools = attacker.tools.concat(node.contains_tools);
                            addToLog(`Attacker exploited ${node.originalLabel} (Node ${targetId}) and gained: ${node.contains_tools.join(', ')}.`);
                        } else {
                            addToLog(`Attacker exploited ${node.originalLabel} (Node ${targetId}).`);
                        }
                        updateAttackerReachableNodes(targetId);
                        if (targetId === 4) {
                            nodes.update([
                                { id: 2, hidden: false, label: 'Web Server' },
                                { id: 3, hidden: false, label: 'Email Server' },
                                { id: 16, hidden: false, label: 'Helpdesk' }
                            ]);
                            edges.update([
                                { id: '1-2', hidden: false },
                                { id: '1-3', hidden: false },
                                { id: '1-16', hidden: false },
                                { id: '2-5', hidden: false },
                                { id: '3-5', hidden: false },
                                { id: '4-5', hidden: false }
                            ]);
                            attacker.reachableNodes.push(2, 3, 16);
                            addToLog('Attacker compromised VPN Server, revealing DMZ nodes.');
                        }
                        if (targetId === 8) {
                            showLoseModal();
                            return;
                        }
                        break;
                }
                const nextActionDelay = attacker.actionIntervalMin + Math.random() * (attacker.actionIntervalMax - attacker.actionIntervalMin);
                setTimeout(performAttackerAction, nextActionDelay);
            } catch (error) {
                console.error('Error in attacker action:', error);
                addToLog('Attacker action failed due to an error.');
            }
        }

        function updateAttackerReachableNodes(nodeId) {
            try {
                const newReachable = edges.get().filter(edge =>
                    edge.from === nodeId || edge.to === nodeId
                ).map(edge =>
                    edge.from === nodeId ? edge.to : edge.from
                ).filter(id => !attacker.compromisedNodes.includes(id) && !nodes.get(id).isolated && !nodes.get(id).hidden);
                attacker.reachableNodes = [...new Set([...attacker.reachableNodes, ...newReachable])];
            } catch (error) {
                console.error('Error updating attacker reachable nodes:', error);
            }
        }

        // Modal displays
        function showWinModal() {
            try {
                var modal = document.getElementById('win-modal');
                var timeDisplay = document.getElementById('time-survived');
                var pointsDisplay = document.getElementById('points');
                var tweetButton = document.getElementById('tweet-button');
                const timeSurvived = (Date.now() - player.startTime) / 1000;
                timeDisplay.textContent = `Time Survived: ${formatTime(timeSurvived)}`;
                pointsDisplay.textContent = `Defense Points: ${player.points.toLocaleString()}`;
                const tweetText = `I defended the NET! Survived: ${formatTime(timeSurvived)}, Points: ${player.points.toLocaleString()}! Play here: https://mr-r3b00t.github.io/defend_the_net/ #Cybersecurity #game`;
                const tweetUrl = `https://x.com/intent/tweet?text=${encodeURIComponent(tweetText)}`;
                tweetButton.onclick = () => window.open(tweetUrl, '_blank');
                modal.style.display = 'flex';
                backgroundAudio.pause();
            } catch (error) {
                console.error('Error showing win modal:', error);
                addToLog('Failed to show win modal due to an error.');
            }
        }

        function showLoseModal() {
            try {
                var modal = document.getElementById('lose-modal');
                var timeDisplay = document.getElementById('lose-time-survived');
                var pointsDisplay = document.getElementById('lose-points');
                var tweetButton = document.getElementById('lose-tweet-button');
                const timeSurvived = (Date.now() - player.startTime) / 1000;
                timeDisplay.textContent = `Time Survived: ${formatTime(timeSurvived)}`;
                pointsDisplay.textContent = `Defense Points: ${player.points.toLocaleString()}`;
                const tweetText = `I defended the NET but lost! Survived: ${formatTime(timeSurvived)}, Points: ${player.points.toLocaleString()}! Play here: https://mr-r3b00t.github.io/defend_the_net/ #Cybersecurity #game`;
                const tweetUrl = `https://x.com/intent/tweet?text=${encodeURIComponent(tweetText)}`;
                tweetButton.onclick = () => window.open(tweetUrl, '_blank');
                modal.style.display = 'flex';
                backgroundAudio.pause();
            } catch (error) {
                console.error('Error showing lose modal:', error);
                addToLog('Failed to show lose modal due to an error.');
            }
        }

        // Restart game
        function restartGame() {
            try {
                backgroundAudio.pause();
                location.reload();
            } catch (error) {
                console.error('Error restarting game:', error);
                addToLog('Failed to restart game due to an error.');
            }
        }

        // Check win condition
        function checkWinCondition() {
            try {
                if (!attacker.compromisedNodes.includes(8)) {
                    showWinModal();
                }
            } catch (error) {
                console.error('Error checking win condition:', error);
                addToLog('Failed to check win condition due to an error.');
            }
        }

        // Network status
        function toggleNetworkStatus() {
            try {
                const status = nodes.get().map(node => {
                    const state = node.compromised ? 'Compromised' : node.isolated ? 'Isolated' : node.hardened ? 'Hardened' : player.scannedNodes.includes(node.id) ? 'Scanned' : 'Unknown';
                    return `Node ${node.id} (${node.originalLabel}): ${state}`;
                });
                addToLog('Network Status:');
                status.forEach(s => addToLog(s));
            } catch (error) {
                console.error('Error toggling network status:', error);
                addToLog('Failed to display network status due to an error.');
            }
        }

        // Handle node click
        let isMenuOpening = false;
        network.on('click', function(params) {
            try {
                if (params.nodes.length > 0) {
                    const nodeId = params.nodes[0];
                    const node = nodes.get(nodeId);
                    if (node.actionInProgress) {
                        addToLog(`Action in progress for ${node.originalLabel}. Please wait.`);
                        return;
                    }
                    const nodeLabel = node.originalLabel;
                    selectAudio.play().catch(error => {
                        console.error('Select audio playback failed:', error);
                    });
                    if (nodeId === 1) return; // Ignore Internet
                    showMenu(nodeId, params.event);
                } else {
                    closeMenu();
                    network.unselectAll();
                    network.selectNodes([]);
                }
            } catch (error) {
                console.error('Error handling node click:', error);
                addToLog('Failed to handle node click due to an error.');
            }
        });

        document.addEventListener('click', function(event) {
            try {
                if (isMenuOpening) {
                    isMenuOpening = false;
                    return;
                }
                const menu = document.getElementById('menu');
                if (menu.style.display === 'block' && !menu.contains(event.target)) {
                    closeMenu();
                    network.unselectAll();
                    network.selectNodes([]);
                }
            } catch (error) {
                console.error('Error handling document click:', error);
                addToLog('Failed to handle document click due to an error.');
            }
        });

        function showMenu(nodeId, event) {
            try {
                isMenuOpening = true;
                const menu = document.getElementById('menu');
                const hardenButton = document.getElementById('harden-button');
                const isolateButton = document.getElementById('isolate-button');
                const node = nodes.get(nodeId);

                if (player.scannedNodes.includes(nodeId) && !node.hardened && !node.isolated && !node.compromised && node.exploitable) {
                    hardenButton.classList.remove('hidden');
                } else {
                    hardenButton.classList.add('hidden');
                }

                if (player.scannedNodes.includes(nodeId) && node.compromised && !node.isolated) {
                    isolateButton.classList.remove('hidden');
                } else {
                    isolateButton.classList.add('hidden');
                }

                menu.style.left = '10px';
                menu.style.top = '10px';
                menu.style.display = 'block';
                menu.dataset.nodeId = nodeId;
                setTimeout(() => { isMenuOpening = false; }, 0);
            } catch (error) {
                console.error('Error showing menu:', error);
                addToLog('Failed to show menu due to an error.');
            }
        }

        function closeMenu() {
            try {
                const menu = document.getElementById('menu');
                if (menu.style.display === 'block') {
                    menu.style.display = 'none';
                }
            } catch (error) {
                console.error('Error closing menu:', error);
                addToLog('Failed to close menu due to an error.');
            }
        }

        function performAction(action) {
            try {
                const nodeId = parseInt(document.getElementById('menu').dataset.nodeId);
                const node = nodes.get(nodeId);
                let message = '';

                if (node.actionInProgress) {
                    message = `Action in progress for ${node.originalLabel}. Please wait.`;
                    isolateAudio.play().catch(error => {
                        console.error('Isolate audio playback failed:', error);
                    });
                    applyNodeGlow(nodeId, '#FFFF00');
                    addToLog(message);
                    closeMenu();
                    return;
                }

                if (nodeId === 5 && action !== 'scan') {
                    message = `The Firewall is already hardened and cannot be modified.`;
                    isolateAudio.play().catch(error => {
                        console.error('Isolate audio playback failed:', error);
                    });
                    applyNodeGlow(nodeId, '#FFFF00');
                    addToLog(message);
                    closeMenu();
                    return;
                }

                switch (action) {
                    case 'scan':
                        if (!player.scannedNodes.includes(nodeId)) {
                            if (player.points < 5) {
                                message = `Insufficient points to scan ${node.originalLabel}. Need 5 points.`;
                                isolateAudio.play().catch(error => {
                                    console.error('Isolate audio playback failed:', error);
                                });
                                applyNodeGlow(nodeId, '#FFFF00');
                                addToLog(message);
                                closeMenu();
                            } else {
                                nodes.update({ id: nodeId, actionInProgress: true });
                                message = `Scanning ${node.originalLabel}... (5 seconds)`;
                                addToLog(message);
                                closeMenu();
                                setTimeout(() => {
                                    try {
                                        player.scannedNodes.push(nodeId);
                                        player.points -= 5;
                                        nodes.update({ id: nodeId, label: node.originalLabel, color: { background: '#00FFFF', border: '#00CCFF' }, actionInProgress: false });
                                        scanAudio.play().catch(error => {
                                            console.error('Scan audio playback failed:', error);
                                        });
                                        const foundIOCs = node.iocs.filter(ioc => !ioc.found);
                                        if (foundIOCs.length > 0) {
                                            foundIOCs.forEach(ioc => ioc.found = true);
                                            player.points += 10;
                                            applyNodeGlow(nodeId, '#FFFF00');
                                            message = `Scan completed for ${node.originalLabel}. Found IOCs: ${foundIOCs.map(ioc => ioc.name).join(', ')}. (+10 points, -5 cost)`;
                                            addToLog(`Earned 10 points for finding IOCs in ${node.originalLabel}. Total points: ${player.points}`);
                                        } else {
                                            applyNodeGlow(nodeId, '#00FF00');
                                            message = `Scan completed for ${node.originalLabel}. No IOCs found. (-5 points)`;
                                        }
                                        addToLog(message);
                                    } catch (error) {
                                        console.error(`Error completing scan for node ${nodeId}:`, error);
                                        addToLog(`Failed to complete scan for ${node.originalLabel} due to an error.`);
                                        nodes.update({ id: nodeId, actionInProgress: false });
                                    }
                                }, 5000); // 5 seconds
                            }
                        } else {
                            message = `${node.originalLabel} has already been scanned. IOCs: ${node.iocs.filter(ioc => ioc.found).map(ioc => ioc.name).join(', ') || 'None'}.`;
                            isolateAudio.play().catch(error => {
                                console.error('Isolate audio playback failed:', error);
                            });
                            applyNodeGlow(nodeId, '#FFFF00');
                            addToLog(message);
                            closeMenu();
                        }
                        break;
                    case 'harden':
                        if (!player.scannedNodes.includes(nodeId)) {
                            message = `Cannot harden ${node.originalLabel}. Scan it first.`;
                            isolateAudio.play().catch(error => {
                                console.error('Isolate audio playback failed:', error);
                            });
                            applyNodeGlow(nodeId, '#FFFF00');
                            addToLog(message);
                            closeMenu();
                        } else if (node.hardened) {
                            message = `${node.originalLabel} is already hardened.`;
                            isolateAudio.play().catch(error => {
                                console.error('Isolate audio playback failed:', error);
                            });
                            applyNodeGlow(nodeId, '#FFFF00');
                            addToLog(message);
                            closeMenu();
                        } else if (node.compromised) {
                            message = `${node.originalLabel} is compromised and cannot be hardened. Isolate it instead.`;
                            isolateAudio.play().catch(error => {
                                console.error('Isolate audio playback failed:', error);
                            });
                            applyNodeGlow(nodeId, '#FFFF00');
                            addToLog(message);
                            closeMenu();
                        } else if (player.points < 10) {
                            message = `Insufficient points to harden ${node.originalLabel}. Need 10 points.`;
                            isolateAudio.play().catch(error => {
                                console.error('Isolate audio playback failed:', error);
                            });
                            applyNodeGlow(nodeId, '#FFFF00');
                            addToLog(message);
                            closeMenu();
                        } else {
                            nodes.update({ id: nodeId, actionInProgress: true });
                            if (nodeId === 8) {
                                message = `Hardening File Server... (30 seconds)`;
                                addToLog(message);
                                closeMenu();
                                setTimeout(() => {
                                    try {
                                        isolateAudio.play().catch(error => {
                                            console.error('Isolate audio playback failed:', error);
                                        });
                                        applyNodeGlow(nodeId, '#FFFF00');
                                        message = `Hardening failed for File Server. Business denied the change.`;
                                        addToLog(message);
                                        nodes.update({ id: nodeId, actionInProgress: false });
                                    } catch (error) {
                                        console.error(`Error completing harden for File Server (node ${nodeId}):`, error);
                                        addToLog(`Failed to complete hardening for File Server due to an error.`);
                                        nodes.update({ id: nodeId, actionInProgress: false });
                                    }
                                }, 30000); // 30 seconds
                            } else {
                                message = `Hardening ${node.originalLabel}... (10 seconds)`;
                                addToLog(message);
                                closeMenu();
                                setTimeout(() => {
                                    try {
                                        node.hardened = true;
                                        player.points -= 10;
                                        player.points += 20;
                                        nodes.update({ id: nodeId, color: { background: '#00FF00', border: '#00CC00' }, actionInProgress: false });
                                        hardenAudio.play().catch(error => {
                                            console.error('Harden audio playback failed:', error);
                                        });
                                        applyNodeGlow(nodeId, '#00FF00');
                                        message = `Hardening completed for ${node.originalLabel}. It is now resistant to exploits. (+20 points, -10 cost)`;
                                        addToLog(`Earned 20 points for hardening ${node.originalLabel}. Total points: ${player.points}`);
                                    } catch (error) {
                                        console.error(`Error completing harden for node ${nodeId}:`, error);
                                        addToLog(`Failed to complete hardening for ${node.originalLabel} due to an error.`);
                                        nodes.update({ id: nodeId, actionInProgress: false });
                                    }
                                }, 10000); // 10 seconds
                            }
                        }
                        break;
                    case 'isolate':
                        if (!player.scannedNodes.includes(nodeId)) {
                            message = `Cannot isolate ${node.originalLabel}. Scan it first.`;
                            isolateAudio.play().catch(error => {
                                console.error('Isolate audio playback failed:', error);
                            });
                            applyNodeGlow(nodeId, '#FFFF00');
                        } else if (node.isolated) {
                            message = `${node.originalLabel} is already isolated.`;
                            isolateAudio.play().catch(error => {
                                console.error('Isolate audio playback failed:', error);
                            });
                            applyNodeGlow(nodeId, '#FFFF00');
                        } else if (!node.compromised) {
                            message = `${node.originalLabel} is not compromised and does not need isolation.`;
                            isolateAudio.play().catch(error => {
                                console.error('Isolate audio playback failed:', error);
                            });
                            applyNodeGlow(nodeId, '#FFFF00');
                        } else if (player.points < 15) {
                            message = `Insufficient points to isolate ${node.originalLabel}. Need 15 points.`;
                            isolateAudio.play().catch(error => {
                                console.error('Isolate audio playback failed:', error);
                            });
                            applyNodeGlow(nodeId, '#FFFF00');
                        } else {
                            node.isolated = true;
                            player.points -= 15;
                            player.points += 30;
                            nodes.update({ id: nodeId, color: { background: '#CCCCCC', border: '#999999' } });
                            isolateAudio.play().catch(error => {
                                console.error('Isolate audio playback failed:', error);
                            });
                            applyNodeGlow(nodeId, '#CCCCCC');
                            edges.update(edges.get().filter(edge => edge.from === nodeId || edge.to === nodeId).map(edge => ({ id: edge.id, hidden: true })));
                            attacker.reachableNodes = attacker.reachableNodes.filter(id => id !== nodeId);
                            message = `Isolated ${node.originalLabel}. It is disconnected from the network. (+30 points, -15 cost)`;
                            addToLog(`Earned 30 points for isolating ${node.originalLabel}. Total points: ${player.points}`);
                            closeMenu();
                        }
                        break;
                }

                if (action !== 'scan' && action !== 'harden') {
                    addToLog(message);
                    closeMenu();
                }
            } catch (error) {
                console.error(`Error performing action ${action} on node ${nodeId}:`, error);
                addToLog(`Failed to perform ${action} on ${node.originalLabel} due to an error.`);
                nodes.update({ id: nodeId, actionInProgress: false });
                closeMenu();
            }
        }
    </script>
</body>
